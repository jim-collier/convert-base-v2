# Demo scenario for gen-demo-gif.py. Each [[step]] types its show= line into the
# fake terminal, runs run= (default: show) for real, and shows the output. {prog}
# renders as the program name; {bin} runs as the tested binary path, and {here}
# is this file's own directory. pause= is the read time in seconds. overflow= is
# "truncate" (default) or "wrap". scrollrate= (px/s) and linems= pace a step's
# output; wpm_digits speeds up number typing. note= takes a list for several
# comment lines, and a step may be notes alone. gap= puts a blank line between
# the command and its output, paste= drops a long number in at once instead of
# typing it, pastepause= holds before it lands, preenter= holds at the end of a
# finished command, typescale= scales the command's typing speed, notepause= is
# read time after each note line. clear= forces a blank screen first; output
# taller than the window clears anyway. end_hold/end_black (seconds) hold the
# last frame, then show black, before looping.

title = "convert-base-v2"
prog  = "convert-base-v2"
seed  = 11
font  = ["Monaspace Argon SemiBold"]
wpm_digits = 293
end_hold  = 3.0
end_black = 3.0

[[step]]
note  = ["Positional notation conversion - any size, any base",
         "If an input or output base isn't specified, base 10 is assumed."]
show  = "{prog} --to crockford 12978189268622352837"
notepause = 0.5
pause = 2.4

[[step]]
note  = "Convert to and from anything in one step"
show  = "{prog} --from rfc1924 --to 62 \"5pN+(oNzA}\""
pause = 2.4

[[step]]
note  = "Negatives and decimals in every positional base, and most codecs too"
show  = "{prog} --to 64emoji -- -62831853.07179586476925286766559005768394"
pause = 2.6

[[step]]
note  = "A base can define its own symbols for negative and decimal point:"
show  = "{prog} --to 10blocks -- -62831853.07179586476925286766559005768394"
pause = 2.6

[[step]]
note  = "Define your own base-13 symbol alphabet, why not:"
show  = "{prog} --to-symbols '0 @ B φ ▲ 9 r 🫪 λ お z ᛯ Ω' -- -62831853.07179586476925286766559005768394"
overflow = "wrap"
pause = 3.8

[[step]]
note  = "Any size number, limited only by memory and time:"
show  = "{prog} --to 512tt 6."
overflow = "wrap"
paste = true
gap   = true
clear = true
scrollrate = 1125
linems = 12
pastepause = 1.0
preenter = 2.0
pause = 4.4

[[step]]
note  = ["Streaming encode and decode of binary data to text",
         "Constant memory at any size, and it decodes faster than basenc"]
show  = "cat logo.jpg | {prog} --binary --to 64u"
run   = "cat {here}/../../private/demos/conversion-sources/size-demo.jpg | {bin} --binary --to 64u"
overflow = "wrap"
gap   = true
clear = true
scrollrate = 1125
linems = 12
pause = 3.0

[[step]]
note  = "Pack an encrypted gif into tweetable text with qntm's base2048"
show  = "cat kiss.gif | xz | openssl aes-128-ecb -pbkdf2 -nosalt -pass pass:12345 | {prog} --binary --to 2048qntm"
run   = "cat {here}/../../private/demos/conversion-sources/kiss.gif | xz | openssl aes-128-ecb -pbkdf2 -nosalt -pass pass:12345 | {bin} --binary --to 2048qntm"
overflow = "wrap"
gap   = true
clear = true
scrollrate = 1125
linems = 12
typescale = 1.5
preenter = 1.0
pause = 4.2

[[step]]
note  = "Several dozen predefined bases for convenience"
show  = "{prog} --list"
clear = true
scrollrate = 108
linems = 255
pause = 5.0

# Deliberately no clear here: the closing notes scroll in under the tail of the
# base list rather than landing on an empty screen.
[[step]]
note  = ["Also a Go module and a browser WebAssembly build, for your own projects",
         "The command, and its WASI build, are licensed GPL-2.0-or-later",
         "The Go module and the browser module are permissive Apache-2.0"]
clear = false
pause = 6.0
