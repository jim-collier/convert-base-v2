# Bare-bones safety net: prove the module vets, tests, and builds off the dev
# box. The full pipeline (fuzz, profiling, dogfood, publish) stays local.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go-version-file resolves from the repo root, not working-directory
          go-version-file: .go-version
          # standard library only, so there is no go.sum and nothing to cache
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
