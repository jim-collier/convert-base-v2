# Five jobs. "build" is the bare safety net: the module vets, tests and builds
# with nothing but Go. "macos-arm64" tests and runs it on Apple silicon.
# "darwin-universal" packages the way the release does, and "macos-universal"
# runs that universal binary on Apple silicon beside the per-arch one. All four
# run on every push to main or dev and every pull request.
# "pipeline" runs cicd/cicd.bash --merge-gate, with its build and test steps in
# the image from cicd/container, so the long tests, the leak checks, the
# harness, interop and every linter run here too. It runs only for main: a
# push or pull request to it, or by hand. Dogfood and publish never run in it.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go-version-file resolves from the repo root, not working-directory
          go-version-file: .go-version
          # the only module is goleak, for the tests, so nothing worth caching
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  # Native Apple silicon. Cross builds only prove darwin/arm64 links, so this
  # runs the tests and the built binary on a real arm64 Mac.
  macos-arm64:
    runs-on: macos-15
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v7
        with:
          # describe and the build stamp need tags and history
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: test
        run: go test ./...
      - name: build
        run: |
          ver="$(git describe --tags --always --dirty --exclude 'lib/*')"
          go build -trimpath -ldflags "-s -w -X main.version=${ver} -X main.buildEpoch=$(git log -1 --format=%ct)" -o convert-base-v2 ./cmd/convert-base-v2
      - name: smoke
        run: |
          set -euo pipefail
          file convert-base-v2 | grep -F arm64
          ./convert-base-v2 --version | tee /dev/stderr | grep -E '^convert-base-v2 v[0-9].* build [0-9a-z]+'
          check() { got="$("${@:2}")"; [[ "${got}" == "$1" ]] || { echo "got '${got}' from $*" >&2; exit 1; }; }
          check FF ./convert-base-v2 255 16
          check 255 ./convert-base-v2 --from 16 FF
          check aGVsbG8= sh -c "printf hello | ./convert-base-v2 --from bytes --to 64"
          check hello sh -c "printf aGVsbG8= | ./convert-base-v2 --from 64 --to bytes"
          check "ɼధശಳপݷટථރŦၓƨ൝" ./convert-base-v2 1234567899999999999999999999999999987654321 2048qntm

  # The release's own packaging, on the release's runner, so the universal
  # binary tested next is the one a release would ship.
  darwin-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # package.bash stamps the version and build from tags and history
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      # nfpm, makensis and goversioninfo are left out, so their packages skip
      # with a warning. The binaries don't use them.
      - name: package
        run: bash cicd/utility/package.bash --out "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: darwin
          path: |
            ${{ runner.temp }}/dist/convert-base-v2-darwin-universal
            ${{ runner.temp }}/dist/convert-base-v2-darwin-arm64
          retention-days: 1
          if-no-files-found: error

  # The universal binary's arm64 half on a real Apple silicon Mac. It has to
  # give the per-arch build's answers, and Gatekeeper has to judge the two the
  # same, quarantined or not.
  macos-universal:
    needs: darwin-universal
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: darwin
      - name: run
        run: |
          set -euo pipefail
          uni=./convert-base-v2-darwin-universal; one=./convert-base-v2-darwin-arm64
          chmod +x "${uni}" "${one}"
          file "${uni}"
          lipo -archs "${uni}" | tee /dev/stderr | grep -qx 'x86_64 arm64'
          [[ "$(uname -m)" == arm64 ]]
          "${uni}" --version | tee /dev/stderr | grep -E '^convert-base-v2 v[0-9].* build [0-9a-z]+'
          check() { got="$("${@:2}")"; [[ "${got}" == "$1" ]] || { echo "got '${got}' from $*" >&2; exit 1; }; }
          for exe in "${uni}" "${one}"; do
            check "$("${one}" --version)" "${exe}" --version
            check J7JQxujqrMS "${exe}" --from 16 --to 62 DEADBEEFCAFE1234
            check aGVsbG8= sh -c "printf hello | ${exe} --from bytes --to 64"
            check hello sh -c "printf aGVsbG8= | ${exe} --from 64 --to bytes"
          done
      # Each verdict is printed, then the two compared with the file name taken
      # out. Only spctl's first line counts: the universal build adds "source=no
      # usable signature", since its x86_64 half is unsigned, where the arm64
      # build's ad hoc signature gives no source. Both are rejected all the same.
      # perl's alarm stands in for timeout, which macOS doesn't have, in case a
      # quarantined run waits on a prompt.
      - name: gatekeeper
        run: |
          set -uo pipefail
          spctl --status || true
          verdict() {
            local f="$1" out rc
            echo "codesign: $(codesign --verify --arch arm64 "${f}" 2>&1; echo "rc $?")"
            out="$(spctl --assess --type execute -vv "${f}" 2>&1)"; rc=$?
            printf '%s\n' "${out}" >&2
            echo "spctl: ${out%%$'\n'*} rc ${rc}"
            cp "${f}" "${f}.q"
            xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "${f}.q"
            echo "quarantined run: $(perl -e 'alarm 30; exec @ARGV' "${f}.q" 255 16 2>&1; echo "rc $?")"
          }
          uni="$(verdict ./convert-base-v2-darwin-universal)"; one="$(verdict ./convert-base-v2-darwin-arm64)"
          printf 'universal:\n%s\narm64:\n%s\n' "${uni}" "${one}"
          [[ "${uni//-darwin-universal/}" == "${one//-darwin-arm64/}" ]] || { echo "Gatekeeper treats the universal build differently" >&2; exit 1; }

  # The image is built on every run from the Actions layer cache and loaded
  # here, never pushed. It's tagged the way cicd.bash looks for it, so the run
  # uses it, and CICD_IMAGE_PREBUILT makes a tag mismatch fail rather than
  # rebuild without the cache. The gif fonts live outside the repo, so the
  # build gets an empty dir for them and the run skips the gif.
  pipeline:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    # the long tests, the race detector, the soak test and CodeQL run here
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # the harness builds v3.0.0 from its tag
          fetch-depth: 0
      - name: image tag and pins
        id: image
        run: |
          echo "tag=$(bash cicd/cicd.bash --image-tag)" >>"$GITHUB_OUTPUT"
          { echo 'args<<EOF'; grep -E '^[A-Z_]+=' cicd/tool-versions.env; echo 'EOF'; } >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/no-gif-fonts"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: cicd/container
          build-contexts: gif-fonts=${{ runner.temp }}/no-gif-fonts
          build-args: ${{ steps.image.outputs.args }}
          tags: ${{ steps.image.outputs.tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # Everything a plain run checks, as far as this runner can. The merge gate
      # never syncs, dogfoods, publishes or prompts on its own.
      - name: merge gate
        env:
          CICD_IMAGE_PREBUILT: "1"
        run: bash cicd/cicd.bash --container --merge-gate
