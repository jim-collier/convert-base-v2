# golangci-lint config (v2). The "standard" set - govet, errcheck, ineffassign,
# staticcheck, unused - is a good baseline for a CLI and the small library behind
# it. Add linters here as the code grows; keep it clean so the cicd lint stage
# stays green.
version: "2"

linters:
  default: standard
  enable:
    # Both earned their place on findings, not on principle. unparam caught two
    # parameters a function took and never read, one of which meant the help
    # text was reading a package constant instead of what it was handed.
    # errorlint guards the typed errors: they are only useful if callers reach
    # them through errors.As, and a == comparison would quietly stop matching.
    - unparam
    - errorlint
  exclusions:
    # shcl/ is a verbatim copy of an upstream file. Findings there belong
    # upstream, and editing the copy would break the copy-over update.
    paths:
      - shcl/
  settings:
    errcheck:
      # Diagnostic/help/usage output goes to os.Stderr via the fmt.Fprint family,
      # where a write error is not actionable (if stderr is broken we cannot report
      # it anyway). Where the write target matters (the buffered --show-symbols
      # writer) the real error is caught at the checked w.Flush(). So skip errcheck
      # on this family rather than wrapping every diagnostic print in a dead check.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
