# Example ~/.config/convert-base-v2/convert-base-v2.conf (YAML format).
# Top-level is a YAML list; each entry defines one base.
#
# Fields:
#   aliases: [names...]   # first entry is the canonical name; later matches override built-ins
#   symbols: "..."        # string form - the digit symbols, whitespace-delimited
#     OR
#   symbols: [...]        # list form - each entry is one literal digit (use for symbols
#                         # containing whitespace or "=" that would confuse the spec parser)
#   negative: "X"         # optional; negative marker
#   decimal:  "Y"         # optional; decimal marker
#   pad: "="              # optional; RFC-style padding char for binary/codec mode
#                         # (decode strips a trailing run of it). Use "" to clear.
#                         # Must be one character, and only applies to power-of-2
#                         # bases of at most 256 symbols - that is the only place
#                         # padding is ever emitted, so setting it elsewhere is an
#                         # error rather than a silent no-op.
#   tail: "..."           # optional; same string-or-list form as symbols. Only for
#                         # power-of-2 bases above 256 symbols, in binary mode.
#                         # See the note below.
#
# The symbols carry digits only. Markers are always these separate fields; the old
# "neg=X dec=Y pad=Z" tokens inside the symbols string are rejected.
#
# Defaults for negative/decimal are "-" and ".". If the default marker is also a
# digit in the base, that is an error, not a silent disable: set the field to an
# empty string ("") to turn the feature (sign or fraction) off on purpose. An
# explicit negative/decimal that conflicts with a digit is likewise an error.
#
# About "tail". A base with more than 256 symbols packs more than 8 bits into a
# digit, so the last digit of a byte stream is usually only partly filled. The
# tail is a second, smaller set of symbols used for that final digit only, which
# tells the decoder how many real bits it carries. Without one the encoder has to
# write a length count up front, so it cannot start writing until it has read all
# the input - which means no streaming and no encoding of anything large. Declare
# a tail and both directions stream in constant memory.
#
# The tail must hold exactly a power of 2 symbols, at least 2^(bits-8) of them
# (4 symbols for a 1024-symbol base, 8 for 2048) and no more than 256, and none
# of them may also be a digit. Anything else is an error at load time.

# Lowercase hex. Overrides the built-in "hex" aliases; the "16" alias is
# unaffected because we don't include it here.
- aliases: [hex, hexadecimal]
  symbols: "0123456789abcdef"

# A toy base 4.
- aliases: [abcd, 4abc]
  symbols: "ABCD"

# Base where the default "-" is itself a digit; give it a different negative.
- aliases: [u12]
  symbols: "0123456789-_"
  negative: "N"

# Custom markers on a base whose digits leave "-" and "." free anyway.
- aliases: [b8alt]
  symbols: "0 1 2 3 4 5 6 7"
  negative: "~"
  decimal: ","

# List form. Preserves symbols that would otherwise be hard to write in a
# whitespace-delimited string.
- aliases: [emoji4]
  symbols: ["🍎", "🍊", "🍋", "🍌"]

# A 512-symbol base with a tail, so binary mode streams both ways. Nine bits per
# digit, so the tail needs 2^(9-8) = 2 symbols, and neither may be a digit. The
# alphabet is left as a placeholder here because 512 symbols is a long line.
#- aliases: [cjk512]
#  symbols: "<512 symbols, whitespace-delimited>"
#  tail: "⸐ ⸑"
